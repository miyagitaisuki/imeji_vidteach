name: Build exe (vidteach MCP)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["mcp/**", ".github/workflows/build-exe.yml"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài PyInstaller
        run: pip install pyinstaller
      - name: Build exe
        run: pyinstaller --onefile --name vidteach-mcp mcp/vidteach_mcp.py
      - name: Kiểm tra exe trả về danh sách tool
        shell: pwsh
        run: |
          $req = '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
          $out = $req | ./dist/vidteach-mcp.exe
          if ($out -notmatch "vt_new_project") { Write-Error "exe không hoạt động: $out"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: vidteach-mcp-windows
          path: dist/vidteach-mcp.exe
      - name: Đính kèm vào Release (khi push tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vidteach-mcp.exe
